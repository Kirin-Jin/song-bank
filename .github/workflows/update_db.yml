name: Scheduled Database Update

on:
  schedule:
    # ⏱️ Cron syntax for "Run at 00:00 every Sunday" (Every 7 days)
    - cron: '0 0 * * 0'
  workflow_dispatch: # Allows you to also trigger it manually with a button click

jobs:
  run-script:
    runs-on: ubuntu-latest
    
    steps:
    # 1. Pull down your repository files into the runner machine
    - name: Checkout repository
      uses: actions/checkout@v4

    # 2. Set up a clean environment running Python
    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.x'

    # 3. Execute your compilation script
    - name: Run database update script
      env:
        # Pass your Google API Key securely from GitHub settings
        API_KEY: ${{ secrets.API_KEY }}
      run: python update_database.py

    # 4. Save and commit the changes back to your GitHub repo
    - name: Commit and push changes
      run: |
        git config --global user.name "github-actions[bot]"
        git config --global user.email "github-actions[bot]@users.noreply.github.com"
        git add database.json
        
        # Check if there are actually changes to commit
        if ! git diff-index --quiet HEAD; then
          git commit -m "Automated database sync"
          
          #Pull remote changes via rebase right before pushing
          git pull --rebase origin main
          
          git push origin main
        else
          echo "No changes detected in database.json. Skipping push."
        fi
