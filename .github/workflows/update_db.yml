name: Scheduled Database Update

on:
  schedule:
    - cron: '0 0 * * 0'
  workflow_dispatch:

jobs:
  run-script:
    runs-on: ubuntu-latest
    
    steps:
    # 1. Updated to latest v4 action (Uses modern Node version)
    - name: Checkout repository
      uses: actions/checkout@v4
      with:
        fetch-depth: 0 

    # 2. Updated to latest v5 action (Uses modern Node version)
    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.x'

    - name: Run database update script
      env:
        API_KEY: ${{ vars.API_KEY }}
      run: python update_database.py

    - name: Commit and push changes
      run: |
        git config --global user.name "github-actions[bot]"
        git config --global user.email "github-actions[bot]@users.noreply.github.com"
        
        # 1. Stash your freshly generated database file safely in memory
        git stash -- database.json
        
        # 2. Fetch the absolute latest state from the remote repository
        git fetch origin main
        
        # 3. Force the runner's workspace history to match GitHub perfectly
        git reset --hard origin/main
        
        # 4. Pop your fresh database file back into the workspace
        git stash pop || true
        
        # 5. Add, commit, and push normally
        git add database.json
        if ! git diff-index --quiet HEAD; then
          git commit -m "Automated database sync"
          git push origin main
        else
          echo "No changes detected in database.json. Skipping push."
        fi
